<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ======================================================================
     【差し替えメモ】ここだけ直せば完成します
     1. 下の <title> と og:title …… お名前に変更
     2. 「【 】」で囲まれた文字 …… すべてご本人の情報に
     3. images/header.jpg …… ヘッダー画像（横長 1200×600px 推奨）
     4. images/profile.jpg …… お顔写真（正方形 600×600px 推奨）
     5. 各リンクの href="#" …… 実際のURLに
     ====================================================================== -->

<title>RUI｜スピリチュアルカウンセラー（霊視鑑定）</title>
<meta name="description" content="O leaf YOU RUIのリンク集。セッションのご予約・SNSはこちらから。">
<meta property="og:title" content="RUI｜スピリチュアルカウンセラー（霊視鑑定）">
<meta property="og:description" content="セッションのご予約・SNSはこちらから。">
<meta property="og:image" content="images/header.jpg">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">

<style>
:root{
  --base:      #FFFAF6;
  --pink:      #F6C6D6;
  --pink-deep: #E3A0B6;
  --yellow:    #FBE6A8;
  --yellow-deep:#F5D077;
  --ink:       #5B4552;
  --ink-soft:  #8B7480;
  --accent:    #C4809A;
}

*{box-sizing:border-box;margin:0;padding:0}

html{-webkit-text-size-adjust:100%}

body{
  background:var(--base);
  color:var(--ink);
  font-family:'Zen Kaku Gothic New',system-ui,sans-serif;
  font-weight:400;
  line-height:1.9;
  min-height:100vh;
  overflow-x:hidden;
}

/* ---------- 背景：ピンクと黄色のベール ---------- */
.veils{
  position:fixed; inset:0; z-index:0;
  overflow:hidden; pointer-events:none;
}
.veil{
  position:absolute;
  border-radius:50%;
  filter:blur(70px);
  opacity:.72;
  mix-blend-mode:multiply;
}
.veil.v1{width:78vw;height:78vw;min-width:340px;min-height:340px;
  top:-16vh;left:-22vw;
  background:radial-gradient(circle at 40% 40%,var(--pink) 0%,rgba(246,198,214,0) 70%);
  animation:drift1 26s ease-in-out infinite;}
.veil.v2{width:82vw;height:82vw;min-width:360px;min-height:360px;
  top:4vh;right:-26vw;
  background:radial-gradient(circle at 55% 45%,var(--yellow) 0%,rgba(251,230,168,0) 70%);
  animation:drift2 31s ease-in-out infinite;}
.veil.v3{width:70vw;height:70vw;min-width:300px;min-height:300px;
  bottom:-18vh;left:8vw;
  background:radial-gradient(circle at 50% 50%,var(--pink) 0%,rgba(246,198,214,0) 72%);
  animation:drift3 35s ease-in-out infinite;}
.veil.v4{width:64vw;height:64vw;min-width:280px;min-height:280px;
  bottom:6vh;right:-14vw;
  background:radial-gradient(circle at 50% 50%,var(--yellow) 0%,rgba(251,230,168,0) 72%);
  animation:drift1 29s ease-in-out infinite reverse;}

@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6vw,5vh) scale(1.12)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1.05)}50%{transform:translate(-7vw,6vh) scale(.94)}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(5vw,-6vh) scale(1.1)}}

/* ---------- 本体 ---------- */
.page{
  position:relative; z-index:1;
  width:100%; max-width:440px;
  margin:0 auto;
  padding:0 22px 56px;
}

/* ヘッダー画像 */
.hero{
  margin:0 -22px;
  aspect-ratio:2/1;
  overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,#000 52%,transparent 100%);
  mask-image:linear-gradient(to bottom,#000 52%,transparent 100%);
  background:linear-gradient(135deg,var(--pink) 0%,var(--yellow) 100%);
}
.hero img{width:100%;height:100%;object-fit:cover;display:block}

/* プロフィール写真 */
.avatar{
  width:168px;height:168px;
  margin:-78px auto 0;
  position:relative;
  border-radius:50%;
  padding:6px;
  background:rgba(255,255,255,.85);
  box-shadow:0 10px 30px rgba(196,128,154,.22);
}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;
  background:linear-gradient(140deg,var(--pink),var(--yellow))}

/* 名前まわり */
.identity{text-align:center;margin-top:20px}
.identity .en{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;font-weight:300;
  font-size:.82rem;letter-spacing:.28em;
  color:var(--accent);
  margin-bottom:6px;
}
.identity h1{
  font-family:'Shippori Mincho',serif;
  font-weight:600;
  font-size:1.62rem;
  letter-spacing:.14em;
  line-height:1.5;
}
.identity .role{
  font-size:.74rem;letter-spacing:.2em;
  color:var(--ink-soft);
  margin-top:10px;
}

/* あいさつ文 */
.greeting{
  font-family:'Shippori Mincho',serif;
  font-size:.86rem;
  line-height:2.3;
  text-align:center;
  color:var(--ink);
  margin-top:26px;
  padding:0 4px;
}

/* 区切り */
.divider{
  display:flex;align-items:center;justify-content:center;gap:12px;
  margin:34px 0 24px;
}
.divider::before,.divider::after{
  content:"";height:1px;flex:1;
  background:linear-gradient(to right,transparent,rgba(196,128,154,.35),transparent);
}
.divider span{
  width:6px;height:6px;border-radius:50%;
  background:var(--accent);opacity:.5;flex:none;
}

/* リンクボタン */
.links{display:flex;flex-direction:column;gap:13px}

.link{
  position:relative;
  display:flex;align-items:center;gap:15px;
  padding:15px 17px;
  border-radius:19px;
  background:rgba(255,255,255,.74);
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 6px 22px rgba(196,128,154,.13);
  text-decoration:none;color:inherit;
  overflow:hidden;
  transition:transform .3s cubic-bezier(.2,.8,.3,1),box-shadow .3s ease;
}
.link::after{ /* 光がすっと横切る */
  content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);
  transform:translateX(-110%);
  transition:transform .75s ease;
  pointer-events:none;
}
.link:hover,.link:focus-visible{
  transform:translateY(-3px);
  box-shadow:0 12px 30px rgba(196,128,154,.22);
}
.link:hover::after,.link:focus-visible::after{transform:translateX(110%)}
.link:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.link:active{transform:translateY(-1px)}

.link .icon{
  flex:none;width:46px;height:46px;border-radius:15px;
  display:grid;place-items:center;
}
.link .icon svg{width:23px;height:23px}
.link .txt{flex:1;min-width:0}
.link .ttl{
  font-family:'Shippori Mincho',serif;
  font-size:1rem;font-weight:600;letter-spacing:.06em;line-height:1.5;
}
.link .sub{
  font-size:.7rem;letter-spacing:.04em;color:var(--ink-soft);
  line-height:1.7;margin-top:2px;
}
.link .arw{flex:none;color:var(--accent);opacity:.55}
.link .arw svg{width:15px;height:15px;display:block}

/* サービス別の色 */
.i-line{background:#E4F6E9;color:#2FA35F}
.i-web {background:#FCEBF1;color:#C4809A}
.i-ig  {background:#FBEAF0;color:#C2557E}
.i-fb  {background:#E8F0FC;color:#3E68B0}
.i-voice{background:#FDF0DC;color:#C4913F}

/* フッター */
footer{
  text-align:center;margin-top:38px;
  font-family:'Cormorant Garamond',serif;
  font-size:.72rem;letter-spacing:.18em;
  color:var(--ink-soft);
}

/* 読み込み時のふわっと */
.fade{opacity:0;transform:translateY(14px);animation:fade .9s ease forwards}
.fade:nth-child(1){animation-delay:.05s}
.hero,.avatar{animation:fade 1s ease .0s forwards;opacity:0}
.identity{animation:fade .9s ease .15s forwards;opacity:0}
.greeting{animation:fade .9s ease .28s forwards;opacity:0}
.divider {animation:fade .9s ease .36s forwards;opacity:0}
.links .link:nth-child(1){animation:fade .8s ease .44s forwards;opacity:0}
.links .link:nth-child(2){animation:fade .8s ease .54s forwards;opacity:0}
.links .link:nth-child(3){animation:fade .8s ease .64s forwards;opacity:0}
.links .link:nth-child(4){animation:fade .8s ease .74s forwards;opacity:0}
.links .link:nth-child(5){animation:fade .8s ease .82s forwards;opacity:0}
footer{animation:fade .8s ease .92s forwards;opacity:0}
@keyframes fade{to{opacity:1;transform:translateY(0)}}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .hero,.avatar,.identity,.greeting,.divider,.link,footer{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
